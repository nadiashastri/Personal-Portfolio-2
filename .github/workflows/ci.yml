name: CI

# Runs the quality checks, tests and build on every pull request and on every
# push to main. Branch protection requires this job to pass before a PR can
# merge, so only verified code reaches main — and Vercel deploys main
# automatically through its GitHub integration.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the code (no write access,
# even for pull requests opened from forks).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality checks, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Test suite
        run: npm test
      - name: Production build
        run: npm run build
